<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZNK Bot — Dashboard</title>
<style>
:root{
  --bg:#0c0d10;--panel:#14161b;--panel2:#1a1d24;--line:#272b34;--text:#e8eaf0;--muted:#8d93a1;
  --accent:#4f8cff;--ok:#2fb56b;--danger:#e05263;--warn:#d9a33a;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;letter-spacing:-.02em}h2{font-size:16px;margin-bottom:12px}h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
small,.muted{color:var(--muted);font-size:12px}
#app{display:flex;min-height:100vh}
aside{width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 10px;font-size:16px;font-weight:700;letter-spacing:-.01em}.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
aside select{margin:0 12px 12px;width:calc(100% - 24px)}
nav{flex:1;overflow:auto;padding:6px 8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#b7bcc8;border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;font-weight:500}
.nav-item:hover{background:var(--panel2);color:#fff}
.nav-item.on{background:var(--panel2);color:#fff;box-shadow:inset 3px 0 var(--accent)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:11px;color:var(--muted);line-height:1.4}
main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1400px;margin:0 auto;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .ico{font-size:20px}.stat b{display:block;font-size:24px;letter-spacing:-.02em;margin-top:6px}.stat span{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:600;font-size:13px;margin-bottom:2px}
.field small{display:block;margin-bottom:5px}
.req{color:var(--danger);margin-left:3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
input[type=color]{padding:3px;height:40px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:var(--danger)}.btn.danger.ghost{background:none;color:var(--danger);border:1px solid #62303a}
.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
.tab:hover{color:var(--text)}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ticket-bar{display:flex;align-items:end;gap:14px;flex-wrap:wrap}
.ticket-bar label{min-width:240px;flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.item .grow{min-width:0;flex:1}.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px;white-space:nowrap}
.pill.ok{color:#7ee2aa;border-color:#2c5b43}.pill.ko{color:#ff9aaa;border-color:#633039}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;margin:0 6px 6px 0}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px}
.chip button:hover{color:#ff9aaa}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px}
.mini:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:26px 14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch:hover{border-color:#fff}
.vouch{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px}
.vouch img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#333;flex-shrink:0}
.vouch .grow{min-width:0}.stars{color:#f1c40f;letter-spacing:1px}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
.alert{border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:13px;border:1px solid}
.alert.info{background:#16233a;border-color:#2b4773;color:#b9cdf2}
.alert.warn{background:#2b2413;border-color:#5c4a1d;color:#f0d79b}
.alert.ko{background:#2d171c;border-color:#5e2c35;color:#f2aab7}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{padding:10px 15px;border-radius:9px;color:#fff;box-shadow:0 8px 30px #0008;animation:up .18s ease}
.toast.ok{background:var(--ok)}.toast.ko{background:var(--danger)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:200;padding:20px}
#login .card{width:340px;max-width:100%}
.result{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.emoji-wrap{display:flex;align-items:center;gap:6px}
.emoji-wrap input{flex:1;min-width:0}
.emoji-btn{flex-shrink:0;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px;line-height:1}
.emoji-btn:hover{border-color:var(--accent)}
.emoji-prev{flex-shrink:0;width:30px;text-align:center;font-size:18px}
.emoji-prev img{width:24px;height:24px;vertical-align:middle}
#emojiPicker{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}
#emojiPicker .ep{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:520px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
#emojiPicker .ep-head{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
#emojiPicker .ep-head b{white-space:nowrap}
#emojiPicker .ep-head input{flex:1;min-width:0}
#emojiPicker .ep-tabs{display:flex;gap:6px;padding:10px 12px 0}
#emojiPicker .ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;padding:12px;overflow:auto}
#emojiPicker .ep-emoji{background:var(--panel2);border:1px solid transparent;border-radius:8px;height:40px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
#emojiPicker .ep-emoji:hover{border-color:var(--accent);background:#20242d}
#emojiPicker .ep-emoji img{width:26px;height:26px;object-fit:contain}
.error-banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:400;max-width:92vw;background:#3a1218;border:1px solid #7a2c38;color:#ffb9c4;border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px #000a;white-space:pre-wrap}
.check{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;font-weight:500}
.check input{width:auto}
.img-prev{max-width:100%;max-height:150px;border-radius:8px;margin-top:8px;border:1px solid var(--line);object-fit:contain;background:#0b0c0f;display:block}
.img-lib{flex:1;min-width:140px}
.md-bar{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:14px;box-shadow:0 6px 18px #0006}
.md-bar .md-hint{color:var(--muted);font-size:12px;margin-right:4px}
.md-bar button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px}
.md-bar button:hover{border-color:var(--accent)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.img-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.img-card .img-thumb{aspect-ratio:16/9;background:#0b0c0f;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-card .img-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.img-card .img-name{font-size:12px;padding:6px 8px}
.img-card .row{gap:6px}
/* ---------- Aperçu en direct (colonne de droite) ---------- */
#previewPane{width:430px;flex-shrink:0;border-left:1px solid var(--line);background:#0a0b0e;padding:22px 16px 60px;position:sticky;top:0;height:100vh;overflow:auto}
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.pv-head b{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pv-hint{font-size:11px;color:var(--muted)}
.pv-chat{background:#313338;border-radius:12px;padding:14px 12px;box-shadow:0 10px 30px #0007}
.pv-line{display:flex;gap:10px;align-items:flex-start}
.pv-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#5865F2,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.pv-body{min-width:0;flex:1}
.pv-name{color:#f2f3f5;font-weight:600;font-size:14px}.pv-app{background:#5865F2;color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle}
.pv-time{color:#949ba4;font-size:11px;margin-left:6px}
.pv-content{color:#dbdee1;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.pv-embed{border-left:4px solid #5865F2;background:#2b2d31;border-radius:5px;padding:12px 14px;margin-top:8px;overflow:hidden}
.pv-e-title{color:#f2f3f5;font-weight:600;font-size:15px;margin-bottom:6px;outline:0;word-break:break-word}
.pv-e-desc{color:#dbdee1;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;outline:0}
.pv-e-desc code{background:#1e1f22;padding:1px 4px;border-radius:3px;font-size:12px}
.pv-thumb{float:right;max-width:80px;max-height:80px;border-radius:5px;margin:0 0 8px 10px;object-fit:cover}
.pv-img{max-width:100%;border-radius:5px;margin-top:10px;display:block}
.pv-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pv-fields.three{grid-template-columns:1fr 1fr 1fr}
.pv-field b{display:block;color:#f2f3f5;font-size:12px;margin-bottom:1px}
.pv-field span{color:#dbdee1;font-size:12px;white-space:pre-wrap;word-break:break-word}
.pv-field.full{grid-column:1/-1}
.pv-foot{color:#b5bac1;font-size:11px;margin-top:10px;display:flex;align-items:center;gap:6px;outline:0}
.pv-foot .pv-dot{width:14px;height:14px;border-radius:50%;background:#5865F2;display:inline-block;flex-shrink:0}
.pv-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pv-btn{background:#4e5058;color:#fff;border:0;border-radius:4px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;outline:0}
.pv-btn.primary{background:#5865F2}.pv-btn.success{background:#248046}.pv-btn.danger{background:#da373c}.pv-btn.secondary{background:#4e5058}
.pv-btn[contenteditable="true"],.pv-e-title[contenteditable="true"],.pv-e-desc[contenteditable="true"],.pv-foot[contenteditable="true"]{outline:2px solid #00a8fc;outline-offset:2px;border-radius:4px;cursor:text}
.pv-select{background:#2b2d31;border:1px solid #1e1f22;border-radius:4px;color:#dbdee1;padding:9px 11px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pv-sections{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pv-section{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2b2d31;border-radius:6px;padding:10px 12px}
.pv-section .pv-sec-txt{color:#dbdee1;font-size:12.5px;white-space:pre-wrap;flex:1;min-width:0;word-break:break-word}
.pv-empty{color:var(--muted);font-size:12px;text-align:center;padding:30px 10px}
@media(max-width:1500px){#previewPane{width:370px}}
@media(max-width:1250px){#previewPane{display:none}}
@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.cols,.grid2{grid-template-columns:1fr}}
@media(max-width:760px){#app{flex-direction:column}aside{width:100%;height:auto;position:static}nav{display:flex;flex-wrap:wrap}main{padding:18px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>

<div id="login" hidden>
  <form class="card" onsubmit="login(event)">
    <h1 style="margin-bottom:4px">ZNK Panel</h1>
    <p class="muted" style="margin-bottom:16px">Entre le mot de passe du dashboard.</p>
    <input id="pw" type="password" placeholder="Mot de passe" autofocus>
    <button class="btn" style="width:100%;margin-top:10px">Se connecter</button>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand">ZNK<span>Dashboard</span></div>
    <select id="guild" onchange="loadGuild(this.value)"></select>
    <nav id="nav"></nav>
    <div class="side-foot" id="sbStatus">Connexion…</div>
  </aside>
  <main id="main"></main>
  <div id="previewPane" hidden></div>
</div>
<div id="errBanner" class="error-banner" hidden></div>
<div id="emojiPicker" hidden>
  <div class="ep">
    <div class="ep-head">
      <b>Emojis</b>
      <input id="ep_search" placeholder="Rechercher un emoji…" oninput="renderEmojiList()">
      <button class="mini" onclick="closeEmoji()" title="Fermer">✕</button>
    </div>
    <div class="ep-tabs">
      <button class="tab on" data-ep="server" onclick="setEmojiTab('server')">Serveur</button>
      <button class="tab" data-ep="unicode" onclick="setEmojiTab('unicode')">Unicode</button>
    </div>
    <div id="ep_list" class="ep-list"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {
  guilds: [], schema: null, gid: null, g: null, page: 'home', tab: 'config', tk: null,
  newTk: false, reasonEdit: null, sp: null, spEdit: false, choiceEdit: null,
  omScope: 'config:', advCmd: null, advSub: null, advResult: null,
  emojiTarget: null, emojiTab: 'server', serverEmojis: null,
  uploads: {}, shop: {}, panelEdit: null, panelDraft: null,
  admin: { scope: 'command', key: '', target: 'role', roleId: '', userId: '', memberQ: '', members: [] },
};
let mdTarget = null;

/* ---------- Mise en forme (gras, italique…) sur n'importe quel champ ---------- */
function isMdField(el) {
  return !!el && el.dataset?.md !== '0' && (el.tagName === 'TEXTAREA' ||
    (el.tagName === 'INPUT' && !['file', 'checkbox', 'radio', 'color', 'range'].includes(el.type)));
}
function mdBar() {
  const b = (label, before, after, title) =>
    `<button type="button" onmousedown="event.preventDefault()" onclick="mdApply('${before}','${after}')" title="${esc(title)}">${label}</button>`;
  return `<div class="md-bar"><span class="md-hint">Sélectionne du texte dans un champ puis :</span>
    ${b('<b>G</b>', '**', '**', 'Gras (Ctrl+B)')}
    ${b('<i>I</i>', '*', '*', 'Italique')}
    ${b('<s>S</s>', '~~', '~~', 'Barré')}
    ${b('Code', '`', '`', 'Code')}
    ${b('Souligné', '__', '__', 'Souligné')}
  </div>`;
}
function mdApply(before, after) {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    if (!isMdField(active)) return toast('Ce champ ne supporte pas la mise en forme.', false);
    mdTarget = active;
  }
  const el = mdTarget;
  if (!isMdField(el)) return toast('Clique d’abord dans un champ de texte.', false);
  const s = el.selectionStart ?? 0;
  const e = el.selectionEnd ?? 0;
  const sel = el.value.slice(s, e) || 'texte';
  el.value = el.value.slice(0, s) + before + sel + after + el.value.slice(e);
  const a = s + before.length;
  const z = a + sel.length;
  el.focus();
  try { el.setSelectionRange(a, z); } catch { /* champ non compatible */ }
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
if (typeof document.addEventListener === 'function') {
  document.addEventListener('focusin', (e) => { if (isMdField(e.target)) mdTarget = e.target; });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'b' && isMdField(e.target)) {
      e.preventDefault();
      mdTarget = e.target;
      mdApply('**', '**');
    }
  });
}

/* ---------- API ---------- */
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { $('#login').hidden = false; $('#app').hidden = true; throw new Error(j.error || 'Connexion requise'); }
  if (!r.ok) throw new Error(j.error || 'Erreur');
  return j;
}
function toast(msg, ok = true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'ko');
  t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 5000);
}
function showError(e) {
  const el = $('#errBanner');
  if (!el) return;
  el.hidden = false;
  el.textContent = 'Erreur : ' + (e && (e.message || e)) ;
  console.error(e);
}
window.addEventListener('error', (e) => showError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason || 'Erreur inconnue'));

/* ---------- Emoji picker (server emojis + unicode) ---------- */
const EMOJI_UNICODE = [
  ['😀', 'sourire happy smile'], ['😁', 'sourire beam'], ['😂', 'rire joie laugh'], ['🤣', 'rire rofl'],
  ['😃', 'sourire happy'], ['😄', 'sourire happy'], ['😅', 'sueur sweat'], ['😆', 'rire laugh'],
  ['😉', 'clin oeil wink'], ['😊', 'sourire blush'], ['😋', 'miam yum'], ['😎', 'cool lunettes'],
  ['😍', 'amour love coeur'], ['😘', 'bisou kiss'], ['🥰', 'amour love'], ['😗', 'bisou kiss'],
  ['🙂', 'sourire slight'], ['🤗', 'calin hug'], ['🤩', 'star etoile'], ['🤔', 'pense think'],
  ['🤨', 'sourcil raised'], ['😐', 'neutre neutral'], ['😑', 'neutre expressionless'], ['🙄', 'yeux au ciel'],
  ['😏', 'sourire narquois smirk'], ['😣', 'persevere'], ['😥', 'decu sad'], ['😮', 'surpris wow'],

function emojiPreview(v) {
  const s = String(v || '').trim();
  if (!s) return '';
  const m = /^<(a?):([\w~]+):(\d+)>$/.exec(s);
  if (m) return `<img src="https://cdn.discordapp.com/emojis/${m[3]}.${m[1] ? 'gif' : 'png'}?size=24" alt="">`;
  return esc(s);
}
function emojiField(id, value, placeholder) {
  return `<div class="emoji-wrap"><input id="${id}" maxlength="64" value="${esc(value)}" placeholder="${esc(placeholder)}" oninput="emojiPrevUpdate(this)">` +
    `<button type="button" class="emoji-btn" title="Choisir un emoji" onclick="openEmoji('${id}')">😀</button>` +
    `<span class="emoji-prev" data-prev="${id}">${emojiPreview(value)}</span></div>`;
}
function emojiPrevUpdate(inp) {
  const prev = document.querySelector(`[data-prev="${inp.id}"]`);
  if (prev) prev.innerHTML = emojiPreview(inp.value);
}
async function openEmoji(id) {
  S.emojiTarget = id;
  const box = $('#emojiPicker');
  if (!box) return;
  box.hidden = false;
  if (S.serverEmojis === null) {
    try {
      const groups = await api('/api/emojis');
      S.serverEmojis = (groups || []).flatMap((g) => (g.emojis || []).map((e) => ({
        name: e.name,
        tag: `<${e.animated ? 'a' : ''}:${e.name}:${e.id}>`,
        url: `https://cdn.discordapp.com/emojis/${e.id}.${e.animated ? 'gif' : 'png'}?size=32`,
      })));
    } catch { S.serverEmojis = []; }
  }
  setEmojiTab(S.serverEmojis.length ? 'server' : 'unicode');
}
function closeEmoji() { const b = $('#emojiPicker'); if (b) b.hidden = true; }
function setEmojiTab(tab) {
  S.emojiTab = tab;
  $$('#emojiPicker [data-ep]').forEach((b) => b.classList.toggle('on', b.dataset.ep === tab));
  renderEmojiList();
}
function renderEmojiList() {
  const box = $('#ep_list');
  if (!box) return;
  const q = ($('#ep_search')?.value || '').toLowerCase().trim();
  if (S.emojiTab === 'server') {
    const items = (S.serverEmojis || []).filter((e) => !q || e.name.toLowerCase().includes(q));
    box.innerHTML = items.length
      ? items.map((e) => `<button type="button" class="ep-emoji" title=":${esc(e.name)}:" onclick="insertEmoji('${e.tag}')"><img src="${e.url}" alt=""></button>`).join('')
      : '<div class="empty" style="grid-column:1/-1">Aucun emoji du serveur.</div>';
    return;
  }
  const items = EMOJI_UNICODE.filter(([c, n]) => !q || n.includes(q) || c === q);
  box.innerHTML = items.length
    ? items.map(([c, n]) => `<button type="button" class="ep-emoji" title="${esc(n)}" onclick="insertEmoji('${c}')">${c}</button>`).join('')
    : '<div class="empty" style="grid-column:1/-1">Aucun résultat.</div>';
}
function insertEmoji(v) {
  const inp = document.getElementById(S.emojiTarget);
  if (inp) { inp.value = v; emojiPrevUpdate(inp); }
  closeEmoji();
}
async function login(e) {
  e.preventDefault();
  try { await api('/api/login', { password: $('#pw').value }); $('#login').hidden = true; boot(); }
  catch (x) { toast(x.message, false); }
}
async function boot() {
  const me = await fetch('/api/me').then((r) => r.json());
  if (!me.authed) { $('#login').hidden = false; return; }
  $('#app').hidden = false;
  [S.schema, S.guilds] = await Promise.all([api('/api/schema'), api('/api/guilds')]);
  $('#guild').innerHTML = S.guilds.map((g) => `<option value="${g.id}">${esc(g.name)} (${g.members})</option>`).join('');
  if (S.guilds[0]) await loadGuild(S.guilds[0].id);
  else { $('#main').innerHTML = '<div class="card empty">Le bot n’est connecté à aucun serveur.</div>'; }
  checkStatus();
  setInterval(checkStatus, 30000);
}
async function loadGuild(id) {
  S.gid = id;
  S.g = await api('/api/guild?id=' + id);
  if (!S.g.tickets.some((t) => t.name === S.tk)) S.tk = S.g.tickets[0]?.name || null;
  S.page = S.page || 'home';
  render();
}
async function refreshGuild() { S.g = await api('/api/guild?id=' + S.gid); }
async function afterChange(msg) {
  await refreshGuild();
  render();
  if (msg) toast(msg);
}
async function checkStatus() {
  try {
    const s = await api('/api/storage');
    const el = $('#sbStatus');
    if (!el) return;
    if (!s.supabase?.enabled) el.innerHTML = '<span style="color:#f0ad4e">Supabase désactivé</span>';

    else el.innerHTML = 'Supabase : <span style="color:#7ee2aa">connecté</span>';
  } catch { /* rien */ }
}

let pvLock = false, pvTimer = null;

function pvVal(sel) { const el = $(sel); return el ? String(el.value ?? '') : ''; }
function pvChecked(sel) { const el = $(sel); return el ? !!el.checked : false; }
function pvImg(id) { const v = imgValue(id); return v.data || v.url; }
function pvVars(text) {
  const t = TC();
  const reason = t ? (t.reasons.find((r) => r.id === S.pvReason) || t.reasons[0]) : null;
  const price = String(reason?.price || '').trim() || '9,99 €';
  return String(text ?? '')
    .replace(/\{user\}/gi, '@Customer')
    .replace(/\{username\}/gi, 'customer')
    .replace(/\{displayname\}/gi, 'Customer')
    .replace(/\{server\}/gi, S.g?.name || 'Serveur')
    .replace(/\{category\}/gi, reason?.label || 'Support')
    .replace(/\{sub\d*\}/gi, '—')
    .replace(/\{config\}/gi, t?.name || 'support')
    .replace(/\{staff\}/gi, '@Staff')
    .replace(/\{number\}/gi, String(t?.counter || 42).padStart(4, '0'))
    .replace(/\{paiement\}/gi, 'PayPal').replace(/\{payement\}/gi, 'PayPal').replace(/\{payment\}/gi, 'PayPal')
    .replace(/\{prix\}/gi, price).replace(/\{price\}/gi, price)
    .replace(/\[prix\]/gi, price).replace(/\[price\]/gi, price)
    .replace(/\{order\}/gi, reason?.label || 'Produit')
    .replace(/\{commande\}/gi, reason?.label || 'Produit')
    .replace(/\{article\}/gi, reason?.label || 'Produit')
    .replace(/\{stars\}/gi, '⭐⭐⭐⭐⭐')
    .replace(/\{ticket\}/gi, 'ticket-0042')
    .replace(/\{claimed\}/gi, '@Staff')
    .replace(/\{date\}/gi, new Date().toLocaleDateString('fr-FR'));
}
function pvMd(text) {
  let s = esc(text);
  s = s.replace(/^### (.+)$/gm, '<b>$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
  return s;
}
function pvButtonHtml(label, style, edit) {
  const cls = { Primary: 'primary', Secondary: 'secondary', Success: 'success', Danger: 'danger' }[style] || 'secondary';
  return `<button type="button" class="pv-btn ${cls}" ${edit ? `data-edit="${edit}" title="Cliquer pour modifier"` : ''}>${esc(label || 'Bouton')}</button>`;
}
function pvMessageHtml({ content = '', embed = null, buttons = [], select = null, sections = null }) {
  const gname = S.g?.name || 'Serveur';
  const initial = esc((gname[0] || 'Z').toUpperCase());
  const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  let inner = '';
  if (content) inner += `<div class="pv-content">${pvMd(content)}</div>`;
  if (embed) {
    const color = colorOf(embed.color || S.g?.panelColor);
    inner += `<div class="pv-embed" style="border-left-color:${color}">`;
    if (embed.thumb) inner += `<img class="pv-thumb" src="${esc(embed.thumb)}" alt="">`;
    if (embed.title) inner += `<div class="pv-e-title" ${embed.editTitle ? `data-edit="${embed.editTitle}" title="Cliquer pour modifier"` : ''}>${pvMd(embed.title)}</div>`;
    if (embed.desc) inner += `<div class="pv-e-desc" ${embed.editDesc ? `data-edit="${embed.editDesc}" title="Cliquer pour modifier"` : ''}>${pvMd(embed.desc)}</div>`;
    if (embed.fields?.length) {
      const three = embed.three || embed.fields.some((f) => f.three);
      inner += `<div class="pv-fields${three ? ' three' : ''}">` + embed.fields.map((f) =>
        `<div class="pv-field ${f.inline === false ? 'full' : ''}"><b>${esc(f.name)}</b><span>${pvMd(f.value)}</span></div>`).join('') + '</div>';
    }
    if (embed.image) inner += `<img class="pv-img" src="${esc(embed.image)}" alt="">`;
    if (embed.footer) inner += `<div class="pv-foot" ${embed.editFooter ? `data-edit="${embed.editFooter}" title="Cliquer pour modifier"` : ''}><span class="pv-dot"></span>${pvMd(embed.footer)}</div>`;
    inner += '</div>';
  }
  if (sections?.length) {
    inner += '<div class="pv-sections">' + sections.map((s) =>
      `<div class="pv-section"><div class="pv-sec-txt">${pvMd(s.text)}</div>${s.button || ''}</div>`).join('') + '</div>';
  }
  if (select) inner += `<div class="pv-select"><span>${esc(select.placeholder)}</span><span>▾</span></div>`;
  if (buttons?.length) inner += `<div class="pv-btns">${buttons.join('')}</div>`;
  return `<div class="pv-chat"><div class="pv-line"><div class="pv-av">${initial}</div><div class="pv-body">
    <div><span class="pv-name">${esc(gname)}</span><span class="pv-app">APP</span><span class="pv-time">Aujourd’hui à ${time}</span></div>
    ${inner}</div></div></div>`;
}

function pvPanelSpec() {
  const t = TC();
  if (!t || !$('#p_type')) return null;
  const type = pvVal('#p_type') || 'bouton';
  const noText = pvChecked('#p_notext');
  const style = pvVal('#p_style') || 'Primary';
  const color = pvVal('#p_color') || S.g.panelColor || '#5865F2';
  const thumb = pvImg('p_thumb') || (pvChecked('#p_logo') ? (S.g.panelLogo || '') : '');
  const embed = {
    color,
    title: noText ? '' : pvVars(pvVal('#p_title')),
    desc: noText ? '' : pvVars(pvVal('#p_desc')),
    thumb, image: pvImg('p_image'), footer: pvVars(pvVal('#p_footer')),
    editTitle: '#p_title', editDesc: '#p_desc', editFooter: '#p_footer',
  };
  let buttons = [], sections = null, select = null;
  if (type === 'bouton') {
    buttons = [pvButtonHtml(pvVal('#p_btn') || 'Ouvrir un ticket', style, '#p_btn')];
  } else if (type === 'boutons') {
    sections = (t.reasons || []).slice(0, 5).map((r) => ({
      text: pvVars(r.panelText || `**${r.label}**${r.description ? '\n' + r.description : ''}`),
      button: pvButtonHtml((r.emoji ? r.emoji + ' ' : '') + r.label, style),
    }));
  } else {
    select = { placeholder: pvVal('#p_placeholder') || 'Choisir une catégorie…' };
  }
  if (pvChecked('#p_stats')) buttons.push(pvButtonHtml('📊 Stats', 'Secondary'));
  return pvMessageHtml({ embed, buttons, sections, select });
}

function pvTextOf(el) {
  const clone = el.cloneNode(true);
  clone.querySelectorAll('br').forEach((b) => b.replaceWith('\n'));
  return clone.textContent.replace(/\u00a0/g, ' ').trim();
}
function wirePreview() {
  const pane = $('#previewPane');
  if (!pane) return;
  pane.querySelectorAll('[data-edit]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (el.getAttribute('contenteditable') === 'true') return;
      e.preventDefault();
      e.stopPropagation();
      el.setAttribute('contenteditable', 'true');
      pvLock = true;
      el.focus();
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    });
    const commit = () => {
      if (el.getAttribute('contenteditable') !== 'true') return;
      el.removeAttribute('contenteditable');
      pvLock = false;
      const target = document.querySelector(el.dataset.edit);
      if (target) {
        target.value = pvTextOf(el).replace(/\s+/g, ' ');
        target.dispatchEvent(new Event('input', { bubbles: true }));
      }
      renderPreview();
    };
    el.addEventListener('blur', commit);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') {
        pvLock = false;
        el.removeAttribute('contenteditable');
        renderPreview();
      }
    });
  });
}
function renderPreview() {
  const pane = $('#previewPane');
  if (!pane) return;
  if (pvLock) return;
  let html = null;
  try { html = previewSpec(); } catch { html = null; }
  if (!html) { pane.hidden = true; pane.innerHTML = ''; return; }
  pane.hidden = false;
  pane.innerHTML = `<div class="pv-head"><b>👁 Aperçu en direct</b><span class="pv-hint">Clique sur un texte pour le modifier</span></div>${html}`;
  wirePreview();
}
function schedulePreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => { if (!pvLock) renderPreview(); }, 90);
}
document.addEventListener('input', (e) => {
  if (e.target.closest && e.target.closest('#main')) schedulePreview();
}, true);
document.addEventListener('change', (e) => {
  if (e.target.closest && e.target.closest('#main')) schedulePreview();
}, true);

function readDataUrl(f) {
  return new Promise((ok, ko) => {
    const rd = new FileReader();
    rd.onload = () => ok(String(rd.result));
    rd.onerror = () => ko(new Error('Lecture du fichier impossible.'));
    rd.readAsDataURL(f);
  });
}
function loadImage(src) {
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => ko(new Error('Image illisible.'));
    im.src = src;
  });
}
// Compresse une image dans le navigateur : les photos de téléphone passent sans dépasser la limite.
async function compressDataUrl(src, maxDim = 1600) {
  const s = String(src || '');
  if (!s.startsWith('data:image/') || /^data:image\/(gif|svg\+xml)/i.test(s)) return s;
  try {
    const im = await loadImage(s);
    let w = im.width || im.naturalWidth;
    let h = im.height || im.naturalHeight;
    if (!w || !h) return s;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(im, 0, 0, w, h);
    let out = c.toDataURL('image/webp', 0.86);
    if (!out.startsWith('data:image/webp')) {
      // Repli : PNG pour garder la transparence des logos, JPEG pour les photos.
      out = c.toDataURL(s.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.86);
    }
    return out.length < s.length ? out : s;
  } catch { return s; }
}
async function compressImage(f, maxDim = 1600) {
  if (/^image\/gif$/i.test(f.type)) return readDataUrl(f);
  return compressDataUrl(await readDataUrl(f), maxDim);
}
async function uploadPick(input, id, maxDim = 1600) {
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\/(png|jpe?g|gif|webp)$/i.test(f.type)) {
    input.value = '';
    return toast('Formats acceptés : PNG, JPG, GIF ou WebP.', false);
  }
  const st = document.getElementById(id + '_state');
  try {
    if (f.size > 12 * 1024 * 1024) throw new Error('Image trop lourde (12 Mo maximum).');
    if (/^image\/gif$/i.test(f.type) && f.size > 4 * 1024 * 1024) throw new Error('GIF trop lourd (4 Mo maximum).');
    if (st) st.textContent = 'Traitement de l’image…';
    const data = await compressImage(f, maxDim);
    if (data.length > 7.5e6) throw new Error('Image trop lourde après compression. Choisis une image plus petite.');
    S.uploads[id] = data;
    const el = document.getElementById(id);
    if (el) el.value = '';
    const sel = document.getElementById(id + '_lib');
    if (sel) sel.value = '';
    setImgPreview(id, data);
    if (st) st.textContent = 'Fichier importé ✓ (' + f.name + ')';
  } catch (e) {
    if (st) st.textContent = '';
    toast(e.message, false);
  } finally {
    input.value = '';
  }
}
function uploadClear(id) {
  delete S.uploads[id];
  const el = document.getElementById(id);
  if (el) el.value = '';
  const st = document.getElementById(id + '_state');
  if (st) st.textContent = '';
  const sel = document.getElementById(id + '_lib');
  if (sel) sel.value = '';
  setImgPreview(id, '');
}
async function libraryPick(sel, id) {
  const imgId = sel.value;
  if (!imgId) return;
  try {
    const img = await api('/api/image-get?guildId=' + encodeURIComponent(S.gid) + '&id=' + encodeURIComponent(imgId));
    const src = String(img.src || '');
    const el = document.getElementById(id);
    if (src.startsWith('data:')) {
      S.uploads[id] = src;
      if (el) el.value = '';
    } else {
      delete S.uploads[id];
      if (el) el.value = src;
    }
    setImgPreview(id, src);
    const st = document.getElementById(id + '_state');
    if (st) st.textContent = 'Bibliothèque : ' + (img.name || 'image');
  } catch (e) { toast(e.message, false); }
}

async function reasonDel(id) {

function priceLike(s) {
  return /^[\d.,]+\s*(?:€|\$|£|euros?|eur|usd)?$/i.test(String(s || '').trim());
}
function parseBulk(text) {
  const out = [];
  for (const line of String(text || '').split(/\r?\n/)) {
    if (!line.trim()) continue;
    const m = /^(.+?)\s*(?::|：|\|)\s*([\d.,]+\s*(?:€|\$|£|euros?|eur|usd)?)\s*$/i.exec(line.trim());
    if (m) out.push({ label: m[1].trim().slice(0, 100), description: m[2].trim().slice(0, 100) });
    else out.push({ label: line.trim().slice(0, 100), description: '' });
  }
  const map = new Map(); out.forEach((i) => map.set(i.label.toLowerCase(), i));
  return [...map.values()];
}
async function bulkImport() {
  const t = TC();
  const items = parseBulk($('#bulk_text').value);
  if (!items.length) return toast('Colle d’abord une liste.', false);
  if ($('#bulk_mode').value === 'replace' && !confirm('Remplacer TOUTES les catégories actuelles par cette liste ?')) return;
  try {
    const r = await api('/api/bulk-choices', {
      guildId: S.gid, config: t.name, target: 'reasons', items, mode: $('#bulk_mode').value,
      emoji: $('#bulk_emoji').value, categoryId: $('#bulk_cat').value,
      staffRoles: [...$('#bulk_role').selectedOptions].map((o) => o.value),
    });
    await afterChange(`${r.added} ajoutée(s), ${r.updated} mise(s) à jour${r.skipped ? `, ${r.skipped} ignorée(s)` : ''}`);
  } catch (e) { toast(e.message, false); }
}

async function panelSend() {
  const t = TC();
  const ch = $('#p_channel').value;
  if (!ch) return toast('Choisis un salon.', false);
  const type = $('#p_type').value;
  if (type === 'menu' && !t.reasons.length) return toast('Ajoute d’abord des catégories pour un menu.', false);
  if (type === 'boutons' && !t.reasons.length) return toast('Ajoute d’abord des catégories pour un panel multi-boutons.', false);
  const noText = $('#p_notext').checked;
  const imgV = imgValue('p_image');
  const thumbV = imgValue('p_thumb');
  if (noText && !imgV.url && !imgV.data) return toast('Pour un panel sans texte, ajoute une image (lien ou fichier).', false);

  // Mise à jour directe d'un panel déjà envoyé : pas de nouveau message.
  if (S.panelEdit) {
    try {
      await api('/api/panel-update', {
        guildId: S.gid, config: t.name, messageId: S.panelEdit,
        fields: {
          title: $('#p_title').value, desc: $('#p_desc').value,
          image: imgV.data || imgV.url, thumb: thumbV.data || thumbV.url,
          footer: $('#p_footer').value, color: $('#p_color').value,
          btnLabel: $('#p_btn').value, btnStyle: $('#p_style').value,
          showLogo: $('#p_logo').checked, statsButton: $('#p_stats').checked, noText, translate: $('#p_translate').checked,
        },
      });
      toast('Panel mis à jour ✅');
      await afterChange();
    } catch (e) { toast(e.message, false); }
    return;
  }

  const options = {
    config: t.name, salon: ch, titre: $('#p_title').value, description: $('#p_desc').value,
    couleur: $('#p_color').value, 'image-url': imgV.url,
    'miniature-url': thumbV.url, logo: $('#p_logo').checked,
    'sans-texte': noText, traduction: $('#p_translate').checked,
    stats: $('#p_stats').checked,
    placeholder: $('#p_placeholder').value, footer: $('#p_footer').value,
    type: $('#p_type').value, 'bouton-texte': $('#p_btn').value, 'couleur-bouton': $('#p_style').value,
  };
  if (imgV.data) options.image = { url: imgV.data, name: uploadName(imgV.data) };
  if (thumbV.data) options.miniature = { url: thumbV.data, name: uploadName(thumbV.data) };
  try {
    const r = await api('/api/run', { guildId: S.gid, command: 'ticket', sub: 'panel', options });
    const txt = r.replies?.[0]?.content || 'Panel envoyé ✅';
    toast(txt.replace(/[*`]/g, '').slice(0, 220), !txt.startsWith('❌'));
    if (!txt.startsWith('❌')) { delete S.uploads.p_image; delete S.uploads.p_thumb; }
    await afterChange();
  } catch (e) { toast(e.message, false); }
}
async function panelDelete(messageId) {

/* ---------- Message d'ouverture ---------- */
function omScopes(t) {
  const L = [{ key: 'config:', type: 'config', id: '', label: '🌐 Toute la configuration' }];
  t.panels.forEach((p, n) => L.push({ key: 'panel:' + p.messageId, type: 'panel', id: p.messageId, label: `📨 Panel ${n + 1} (${chName(p.channelId)})` }));
  const ids = new Set(t.reasons.map((r) => r.id));
  [...t.reasons, ...(t.dmChoices || []).filter((r) => !ids.has(r.id))].forEach((r) => L.push({ key: 'reason:' + r.id, type: 'reason', id: r.id, label: '📋 Catégorie : ' + r.label }));
  (t.subPanels || []).forEach((sp) => sp.choices.forEach((c) => L.push({ key: 'sub:' + sp.id + '/' + c.id, type: 'sub', id: sp.id + '/' + c.id, label: `🗂️ ${sp.name} › ${c.label}` })));
  return L;
}
function ownOpenMsg(t, x) {
  if (!x) return null;
  if (x.openMsg && Object.keys(x.openMsg).length) return x.openMsg;
  if (x.openMsgId) return (t.openPresets || []).find((p) => p.id === x.openMsgId)?.openMsg || null;
  return null;
}
function currentOpenMsg(t, sc) {
  if (sc.type === 'config') return ownOpenMsg(t, t) || {};
  if (sc.type === 'panel') return ownOpenMsg(t, t.panels.find((p) => p.messageId === sc.id)) || ownOpenMsg(t, t) || {};
  if (sc.type === 'reason') return ownOpenMsg(t, [...t.reasons, ...(t.dmChoices || [])].find((r) => r.id === sc.id)) || ownOpenMsg(t, t) || {};
  if (sc.type === 'sub') {
    const [sid, cid] = sc.id.split('/');
    const c = (t.subPanels || []).find((s) => s.id === sid)?.choices.find((x) => x.id === cid);
    return ownOpenMsg(t, c) || ownOpenMsg(t, t) || {};
  }
  return {};
}

function omRead() {
  const img = imgValue('om_image'), th = imgValue('om_thumb');
  const m = {
    content: $('#om_content').value, title: $('#om_title').value, description: $('#om_desc').value,
    image: img.data || img.url, thumbnail: th.data || th.url, footer: $('#om_footer').value,
    color: $('#om_color').value, claimLabel: $('#om_claim').value, closeLabel: $('#om_close').value,
    claimEmoji: $('#om_claim_e').value, closeEmoji: $('#om_close_e').value,
  };
  const out = {};
  for (const [k, v] of Object.entries(m)) if (String(v).trim()) out[k] = String(v).trim();
  out.fields = omFieldsRead();
  if ($('#om_showinfo')) out.showInfo = $('#om_showinfo').checked;
  if ($('#om_nodefault')) out.noDefaultDesc = $('#om_nodefault').checked;
  if ($('#om_ts')) out.timestamp = $('#om_ts').checked;
  const infoLabels = {};
  for (const [k, id] of [['config', '#om_l_config'], ['category', '#om_l_category'], ['sub', '#om_l_sub'], ['payment', '#om_l_payment']]) {
    const el = $(id);
    if (el && el.value.trim()) infoLabels[k] = el.value.trim();
  }
  if (Object.keys(infoLabels).length) out.infoLabels = infoLabels;
  return out;
}
async function omSave() {
  const t = TC();
  const sc = omScopes(t).find((s) => s.key === S.omScope);
  if (!sc) return;
  const msg = omRead();
  try {
    await api('/api/ticket-open-msg', { guildId: S.gid, config: t.name, scope: { type: sc.type, id: sc.id }, msg });
    await afterChange('Message d’ouverture enregistré ✅');
  } catch (e) { toast(e.message, false); }
}
async function omReset() {
  const t = TC();
  const sc = omScopes(t).find((s) => s.key === S.omScope);
  if (!sc || !confirm('Retirer le message personnalisé de cet élément ?')) return;
  try {
    await api('/api/ticket-open-msg', { guildId: S.gid, config: t.name, scope: { type: sc.type, id: sc.id }, reset: true });

}

// Lit le formulaire et met à jour le brouillon (le formulaire garde ses valeurs d'une page à l'autre).
function shopSync(kind) {
  const st = shopState(kind);
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
  const ch = val('shop_channel'); if (ch !== null) st.channelId = ch;
  const title = val('shop_title'); if (title !== null) st.title = title;
  const text = val('shop_text'); if (text !== null) st.text = text;
  const footer = val('shop_footer'); if (footer !== null) st.footer = footer;
  const color = val('shop_color'); if (color !== null) st.color = color;
  const logo = document.getElementById('shop_logo'); if (logo) st.logo = logo.checked;
  const rows = $$('#shop_rows .shop-stock');
  if (rows.length) st.rows = rows.map((row) => ({
    variant: row.querySelector('.sr-variant').value,
    price: row.querySelector('.sr-price').value,
    stock: row.querySelector('.sr-stock').value,
  }));
  const links = $$(`#shop_links_${kind} .shop-link`);
  if (links.length) st.links = links.map((row) => {
    const raw = row.querySelector('.sl-url')?.value.trim() || '';
    const chan = row.querySelector('.sl-chan')?.value || '';
    return {
      label: row.querySelector('.sl-label')?.value || '',
      // Un salon choisi devient un lien Discord qui ouvre le salon directement.
      url: raw || (chan ? channelUrl(chan) : ''),
      channelId: raw ? discordChannelId(raw) : chan,
      emoji: row.querySelector('.sl-emoji')?.value || '',
    };
  });
  const img = imgValue('shop_img_' + kind);
  st.image = img.data || img.url;
  const th = imgValue('shop_thumb_' + kind);
  st.thumb = th.data || th.url;
  return st;
}
function shopParams(kind) {
  const st = shopSync(kind);
  return {
    title: st.title,
    text: kind === 'product' ? st.text : '',
    lines: kind === 'restock' ? st.rows.map((r) => [r.variant, r.price, r.stock].join(' | ')).join('\n') : '',
    rows: kind === 'restock' ? st.rows : [],
    links: st.links.map((l) => [l.label, l.url, l.emoji].filter((x) => String(x || '').trim()).join(' | ')).join('\n'),
    image: st.image, thumb: st.thumb, footer: st.footer, color: st.color, logo: st.logo,
  };
}
function shopPosts(kind) {
  const posts = (S.g.shopPosts || []).filter((p) => p.kind === kind);
  if (!posts.length) return '<div class="empty">Aucun message envoyé pour le moment.</div>';
  return posts.map((p) => {
    const pr = p.params || {};
    const first = kind === 'product' ? String(pr.text || '').split('\n')[0] : String(pr.lines || '').split('\n')[0];
    const title = (pr.title || first || '(sans titre)').slice(0, 90);
    return `<div class="item"><div class="grow"><b>${esc(title)}</b>
      <small>${chName(p.channelId)} · ${fmtDate(p.at)} · message ${p.messageId}${pr.logo === false ? ' · sans logo' : ''}</small></div>
      <div class="row">
        <button class="mini" onclick="shopLoad('${kind}','${p.id}')">✏️ Modifier</button>
        <button class="mini" onclick="shopResend('${kind}','${p.id}')">📤 Renvoyer</button>
        <button class="mini" onclick="shopDeletePost('${kind}','${p.id}')">🗑️</button>
      </div></div>`;
  }).join('');
}
async function shopLoad(kind, id) {
  try {
    const post = await api('/api/shop-get?guildId=' + encodeURIComponent(S.gid) + '&id=' + encodeURIComponent(id));
    const pr = post.params || {};
    const rows = (Array.isArray(pr.rows) && pr.rows.length) ? pr.rows
      : String(pr.lines || '').split('\n').filter((l) => l.trim()).map((line) => {
        const [variant = '', price = '', stock = ''] = line.split('|').map((x) => x.trim());
        return { variant, price, stock };
      });
    const links = String(pr.links || '').split('\n').filter((l) => l.trim()).map((line) => {
      const [label = '', url = '', emoji = ''] = line.split('|').map((x) => x.trim());
      const chan = discordChannelId(url);
      const name = /^#(.+)$/.exec(url);
      const byName = name && (S.g.channels || []).find((c) => String(c.name || '').toLowerCase() === name[1].toLowerCase());
      const known = (chan && (S.g.channels || []).some((c) => c.id === chan)) ? chan : (byName?.id || '');
      // Un lien de salon connu est rechargé dans le sélecteur « ou salon » (plus lisible qu'une longue URL).
      return { label, url: known ? '' : url, emoji, channelId: known };
    });
    S.shop[kind] = {
      id: post.id, channelId: post.channelId, title: pr.title || '',
      text: pr.text || '', footer: pr.footer || '', color: pr.color || '', logo: pr.logo !== false,
      image: pr.image || '', thumb: pr.thumb || '',
      links: links.length ? links : [{ label: '', url: '', emoji: '', channelId: '' }],
      rows: rows.length ? rows : [{ variant: '', price: '', stock: '' }],
    };
    delete S.uploads['shop_img_' + kind];
    delete S.uploads['shop_thumb_' + kind];
    render();
    toast('Paramètres chargés : modifie ce que tu veux puis clique sur « Mettre à jour ».');
  } catch (e) { toast(e.message, false); }
}
function shopNew(kind) {
  S.shop[kind] = null;
  delete S.uploads['shop_img_' + kind];
  delete S.uploads['shop_thumb_' + kind];
  render();
}
async function shopSend(kind) {
  const st = shopSync(kind);
  if (!st.channelId) return toast('Choisis un salon.', false);
  const params = shopParams(kind);
  if (kind === 'product' && !String(params.text).trim()) return toast('Ajoute une description.', false);
  if (kind === 'restock' && !String(params.lines).trim()) return toast('Ajoute au moins une variante.', false);
  const action = st.id ? 'edit' : 'new';
  try {
    await api('/api/shop', { guildId: S.gid, action, id: st.id || undefined, kind, channelId: st.channelId, params });
    toast(action === 'edit' ? 'Message mis à jour ✅' : 'Message envoyé ✅');
    await afterChange();
  } catch (e) { toast(e.message, false); }
}
async function shopResend(kind, id, useForm) {
  const post = (S.g.shopPosts || []).find((p) => p.id === id);
  if (!post) return toast('Message introuvable.', false);
  const body = { guildId: S.gid, action: 'resend', id, kind };
  if (useForm) {
    body.params = shopParams(kind);
    body.channelId = shopState(kind).channelId || undefined;
  }
  try {
    await api('/api/shop', body);
    toast('Message renvoyé ✅');
    await afterChange();
  } catch (e) { toast(e.message, false); }
}
async function shopDeletePost(kind, id) {
  if (!confirm('Supprimer ce message de Discord ?')) return;
  try {
    await api('/api/shop', { guildId: S.gid, action: 'delete', id, kind });
    if (shopState(kind).id === id) shopNew(kind);
    toast('Message supprimé');
    await afterChange();
  } catch (e) { toast(e.message, false); }
}
function pageShop(kind) {

  const editing = !!st.id;
  const imgId = 'shop_img_' + kind;
  const thumbId = 'shop_thumb_' + kind;

      : 'Panel restock : variantes, prix, stock, image, logo et boutons-liens. Modifie ou renvoie un message déjà envoyé sans tout refaire.') +
    `<section class="card"><h2>Messages déjà envoyés (${count})</h2>

async function imageLibAdd() {
  const v = imgValue('img_src');
  const src = v.data || v.url;
  if (!src) return toast('Choisis une image (lien ou fichier).', false);
  try {
    const small = await compressDataUrl(src, 1400);
    await api('/api/images', { guildId: S.gid, action: 'add', name: $('#img_name').value.trim(), src: small });
    delete S.uploads.img_src;
    await afterChange('Image ajoutée à la bibliothèque ✅');
  } catch (e) { toast(e.message, false); }
}
async function imageRename(id) {
  const inp = document.querySelector(`input[data-img="${CSS.escape(id)}"]`);
  const name = inp ? inp.value.trim() : '';
  if (!name) return toast('Donne un nom à l’image.', false);
  try {
    await api('/api/images', { guildId: S.gid, action: 'rename', id, name });
    await afterChange('Image renommée ✅');
  } catch (e) { toast(e.message, false); }
}
async function imageDelete(id) {
  if (!confirm('Supprimer cette image de la bibliothèque ? Les messages déjà envoyés ne changent pas.')) return;
  try {
    await api('/api/images', { guildId: S.gid, action: 'delete', id });
    await afterChange('Image supprimée');
  } catch (e) { toast(e.message, false); }
}
async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('Lien copié ✅');
  } catch { toast('Copie impossible.', false); }
}

function adminPerms() {
  const p = S.g.perms || {};
  return {
    cmdPerms: p.cmdPerms || {}, cmdUsers: p.cmdUsers || {},
    catPerms: p.catPerms || {}, catUsers: p.catUsers || {},
    fullRoles: p.fullRoles || [], fullUsers: p.fullUsers || [], modRoles: p.modRoles || [],
  };
}
const adminRoleName = (id) => {
  const r = (S.g.roles || []).find((x) => x.id === id);
  return r ? '@' + r.name : 'Rôle ' + id;
};
const adminUserName = (id) => (S.g.memberNames || {})[id] || ('Membre ' + id);
function adminChips(ids, target, scope, key) {
  if (!ids || !ids.length) return '<span class="muted">Aucun.</span>';
  const name = target === 'role' ? adminRoleName : adminUserName;
  return ids.map((id) => `<span class="chip">${esc(name(id))}<button type="button" title="Retirer" onclick="adminPerm('${scope}','${esc(key)}','${target}','${id}','remove')">✕</button></span>`).join('');
}
function pageAdmin() {
  const p = adminPerms();
  const a = S.admin;
  const cats = S.schema.categories || {};
  const cmds = [...(S.schema.commands || [])].sort((x, y) =>
    String(x.category || '').localeCompare(String(y.category || '')) || x.name.localeCompare(y.name));
  const isCmd = a.scope === 'command';
  if (isCmd && !cmds.some((c) => c.name === a.key)) a.key = cmds[0]?.name || '';
  if (!isCmd && !cats[a.key]) a.key = Object.keys(cats)[0] || '';
  const key = a.key;
  const roles = isCmd ? (p.cmdPerms[key] || []) : (p.catPerms[key] || []);
  const users = isCmd ? (p.cmdUsers[key] || []) : (p.catUsers[key] || []);
  const cmd = isCmd ? cmds.find((c) => c.name === key) : null;
  const inherited = cmd ? (p.catPerms[cmd.category] || []) : [];
  const inheritedUsers = cmd ? (p.catUsers[cmd.category] || []) : [];
  const cmdOptions = Object.entries(cats).map(([cat, label]) => {
    const list = cmds.filter((c) => c.category === cat);
    if (!list.length) return '';
    return `<optgroup label="${esc(label)}">${list.map((c) =>
      `<option value="${esc(c.name)}" ${c.name === key && isCmd ? 'selected' : ''}>/${esc(c.name)}${c.flags?.owner ? ' (propriétaire)' : ''}${c.flags?.public ? ' (public)' : ''}</option>`).join('')}</optgroup>`;
  }).join('');
  const catOptions = Object.entries(cats).map(([k, label]) =>
    `<option value="${esc(k)}" ${k === key && !isCmd ? 'selected' : ''}>${esc(label)}</option>`).join('');
  const members = (a.members || []).map((m) => `<div class="item"><div class="grow"><b>${esc(m.name)}</b> <small>${esc(m.tag)}</small></div>
    <div class="row"><button class="mini" onclick="adminPerm('${isCmd ? 'command' : 'category'}','${esc(key)}','user','${m.id}','add')">Ajouter</button>
    <button class="mini" onclick="adminPerm('all','','user','${m.id}','add')">Tout autoriser</button></div></div>`).join('');
  return head('Admin', 'Choisis qui peut utiliser chaque commande : par rôle ou par personne. « Tout autoriser » donne immédiatement toutes les commandes.') +
    `<section class="card"><h2>Accès à une commande</h2>
      <div class="grid2">
        <label class="field"><span>Type d’accès</span><select onchange="S.admin.scope=this.value;S.admin.key='';render()">
          <option value="command" ${isCmd ? 'selected' : ''}>Par commande</option>
          <option value="category" ${!isCmd ? 'selected' : ''}>Par catégorie de commandes</option>
        </select></label>
        <label class="field"><span>${isCmd ? 'Commande' : 'Catégorie'}</span><select onchange="S.admin.key=this.value;render()">${isCmd ? cmdOptions : catOptions}</select></label>
      </div>
      ${cmd ? `<div class="alert info" style="margin-top:4px">Catégorie : <b>${esc(cats[cmd.category] || cmd.category || 'Autres')}</b>${inherited.length ? ` · hérite des rôles ${inherited.map((id) => esc(adminRoleName(id))).join(', ')}` : ''}${inheritedUsers.length ? ` · membres ${inheritedUsers.map((id) => esc(adminUserName(id))).join(', ')}` : ''}.</div>` : ''}
      <div class="grid2" style="margin-top:14px">
        <div><h3>Rôles autorisés</h3>${adminChips(roles, 'role', isCmd ? 'command' : 'category', key)}</div>
        <div><h3>Membres autorisés</h3>${adminChips(users, 'user', isCmd ? 'command' : 'category', key)}</div>
      </div>
      <h3>Ajouter un rôle</h3>
      <div class="row"><select id="adm_role" style="flex:1;min-width:200px">${roleOptions('')}</select>
        <button class="btn" onclick="adminAddRole(false)">Ajouter</button>
        <button class="btn ghost" onclick="adminAddRole(true)">Tout autoriser à ce rôle</button></div>
      <h3 style="margin-top:18px">Ajouter une personne</h3>
      <div class="row"><input id="adm_mq" value="${esc(a.memberQ || '')}" placeholder="Pseudo ou ID du membre…" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')adminSearch()">
        <button class="btn" onclick="adminSearch()">Rechercher</button></div>
      <div class="list" style="margin-top:10px">${members || '<div class="empty">Cherche un membre pour l’autoriser nominativement.</div>'}</div>
    </section>
    <section class="card"><h2>Accès total (toutes les commandes)</h2>
      <p class="muted" style="margin-bottom:10px">Le propriétaire du serveur a toujours tout. Ajoute ici un rôle ou une personne pour lui donner <b>toutes</b> les commandes d’un coup.</p>
      <div class="grid2">
        <div><h3>Rôles avec accès total</h3>${adminChips(p.fullRoles, 'role', 'all', '')}</div>
        <div><h3>Membres avec accès total</h3>${adminChips(p.fullUsers, 'user', 'all', '')}</div>
      </div>
      <div class="row" style="margin-top:12px"><select id="adm_full_role" style="flex:1;min-width:200px">${roleOptions('')}</select>
        <button class="btn" onclick="adminAddFull('role')">Tout autoriser à ce rôle</button></div>
      <div class="row" style="margin-top:8px"><input id="adm_full_user" placeholder="ID du membre…" style="flex:1;min-width:200px">
        <button class="btn" onclick="adminAddFull('user')">Tout autoriser à ce membre</button></div>
      <div class="alert info" style="margin-top:12px">Les commandes publiques (<b>/help</b>, <b>/vouch</b>, <b>/invites</b>…) restent ouvertes à tous. Les commandes réservées au propriétaire ne peuvent pas être déléguées.</div>

    <section class="card"><h2>Rôles de modération</h2>
      <p class="muted" style="margin-bottom:10px">Ces rôles peuvent utiliser ban / unban / mute / unmute (réglage via <b>/roles-mod</b> dans Discord).</p>
      ${adminChips(p.modRoles, 'role', 'mod', '')}
      <div class="row" style="margin-top:12px"><select id="adm_mod_role" style="flex:1;min-width:200px">${roleOptions('')}</select>
        <button class="btn" onclick="adminAddMod()">Ajouter le rôle de modération</button></div>
    </section>`;
}
async function adminPerm(scope, key, target, id, action) {
  if (!id) return toast('Choisis d’abord un rôle ou un membre.', false);

    await api('/api/perms', { guildId: S.gid, scope, key, target, id, action });

function advancedBody() {
  const cats = S.schema.categories;
  let h = '';
  if (!S.advCmd) {
    h += `<section class="card"><h2>Choisir une commande</h2>`;
    for (const [key, label] of Object.entries(cats)) {
      const list = S.schema.commands.filter((c) => c.category === key);
      if (!list.length) continue;
      h += `<h3>${esc(label)}</h3><div class="row">${list.map((c) => `<button class="mini" onclick="advPick('${esc(c.name)}')">/${esc(c.name)}</button>`).join('')}</div>`;
    }
    h += `<h3>Autres</h3><div class="row">${S.schema.commands.filter((c) => !c.category || c.category === 'autres').map((c) => `<button class="mini" onclick="advPick('${esc(c.name)}')">/${esc(c.name)}</button>`).join('')}</div></section>`;
    return h;
  }
  const c = S.schema.commands.find((x) => x.name === S.advCmd);
  if (!c) { S.advCmd = null; return advancedBody(); }
  const subs = (c.options || []).filter((o) => o.type === 1);
  const def = S.advSub ? subs.find((s) => s.name === S.advSub) : c;
  const key = c.name + (S.advSub ? '/' + S.advSub : '');
  const modals = S.schema.modals[key];
  h += `<section class="card">
    <div class="row" style="justify-content:space-between"><h2>/${esc(c.name)}</h2><button class="mini" onclick="S.advCmd=null;S.advSub=null;S.advResult=null;render()">Changer de commande</button></div>
    <p class="muted" style="margin-bottom:12px">${esc(c.description || '')}</p>
    ${subs.length ? `<div class="tabs">${subs.map((s) => `<button class="tab ${S.advSub === s.name ? 'on' : ''}" onclick="advSub('${esc(s.name)}')">${esc(s.name)}</button>`).join('')}</div>` : ''}
    ${S.advSub ? `<p class="muted" style="margin-bottom:10px">${esc(def.description || '')}</p>` : ''}
    ${(def.options || []).filter((o) => o.type !== 1).map(advField).join('')}
    ${modals ? `<h3>Contenu du message</h3>${modals.map((m) => `<label class="field"><span>${esc(m.label)}${m.req ? '<b class="req">*</b>' : ''}</span>${m.long ? `<textarea data-modal="${m.id}" maxlength="${m.max}"></textarea>` : `<input data-modal="${m.id}" maxlength="${m.max}">`}</label>`).join('')}` : ''}
    ${!(def.options || []).filter((o) => o.type !== 1).length && !modals ? '<p class="muted">Aucune option : clique sur Exécuter.</p>' : ''}
    <div class="row" style="margin-top:12px"><button class="btn" onclick="advRun()">Exécuter</button></div>
    ${S.advResult || ''}
  </section>`;
  return h;
}
function pageAdvanced() {
  return head('Commandes', 'Toutes les commandes du bot, y compris celles qui n’ont pas encore de page dédiée.') + advancedBody();
}
function advField(o) {
  const name = o.name;
  const req = o.required ? '<b class="req">*</b>' : '';
  let input;
  if (o.choices?.length) {
    input = `<select data-adv="${name}"><option value="">—</option>${o.choices.map((c) => `<option value="${esc(c.value)}">${esc(c.name)}</option>`).join('')}</select>`;
  } else if (o.type === 5) {
    input = `<select data-adv="${name}"><option value="">Non précisé</option><option value="true">Oui</option><option value="false">Non</option></select>`;
  } else if (o.type === 7) {
    const types = o.channel_types;
    input = `<select data-adv="${name}"><option value="">— choisir un salon —</option>${(S.g.channels || []).filter((c) => !types || types.includes(c.type)).map((c) => `<option value="${c.id}">${c.type === 4 ? '📁 ' : '# '}${esc(c.name)}</option>`).join('')}</select>`;
  } else if (o.type === 8) {
    input = `<select data-adv="${name}"><option value="">— choisir un rôle —</option>${(S.g.roles || []).map((r) => `<option value="${r.id}">@${esc(r.name)}</option>`).join('')}</select>`;
  } else if (o.type === 6) {
    input = `<div class="row"><input data-adv="${name}" placeholder="ID du membre" style="flex:1;min-width:160px"><select data-pick="${name}" style="max-width:240px"><option value="">Choisir un membre…</option></select></div>`;
  } else if (o.type === 4 || o.type === 10) {
    input = `<input data-adv="${name}" type="number" ${o.min_value != null ? `min="${o.min_value}"` : ''} ${o.max_value != null ? `max="${o.max_value}"` : ''}>`;
  } else if (o.type === 11) {
    input = `<input data-adv="${name}" placeholder="https://…">`;
  } else {
    input = `<input data-adv="${name}" ${o.max_length ? `maxlength="${o.max_length}"` : ''}>`;
  }
  return `<label class="field"><span>${esc(o.description || name)}${req}</span><small>${esc(name)}</small>${input}</label>`;
}
function advPick(name) {
  S.advCmd = name; S.advSub = null; S.advResult = null;
  if (!(S.page === 'tickets' && S.tab === 'commands')) S.page = 'advanced';
  render();
}
function advSub(name) { S.advSub = S.advSub === name ? null : name; S.advResult = null; render(); }
async function fillMembers() {
  const selects = $$('select[data-pick]');
  if (!selects.length) return;
  try {
    const list = await api('/api/members?id=' + S.gid + '&q=');
    const opts = list.map((m) => `<option value="${m.id}">${esc(m.name)} (${esc(m.tag)})</option>`).join('');
    selects.forEach((s) => {
      s.innerHTML = '<option value="">Choisir un membre…</option>' + opts;
      s.onchange = () => {
        const inp = document.querySelector(`[data-adv="${s.dataset.pick}"]`);
        if (inp && s.value) inp.value = s.value;
      };
    });
  } catch { /* rien */ }
}
function advCollect() {
  const options = {};
  $$('[data-adv]').forEach((el) => { if (el.value !== '') options[el.dataset.adv] = el.value; });
  const modal = {};
  $$('[data-modal]').forEach((el) => { if (el.value.trim()) modal[el.dataset.modal] = el.value; });
  return { options, modal };
}
async function advRun() {
  const c = S.schema.commands.find((x) => x.name === S.advCmd);
  const subs = (c.options || []).filter((o) => o.type === 1);
  const def = S.advSub ? subs.find((s) => s.name === S.advSub) : c;
  const { options, modal } = advCollect();
  for (const o of (def.options || []).filter((o) => o.type !== 1)) {
    if (o.required && !options[o.name]) return toast('Champ requis : ' + (o.description || o.name), false);
  }
  if (subs.length && !S.advSub) return toast('Choisis une sous-commande.', false);
  const key = c.name + (S.advSub ? '/' + S.advSub : '');
  const modals = S.schema.modals[key];
  for (const m of modals || []) if (m.req && !modal[m.id]?.trim()) return toast('Champ requis : ' + m.label, false);
  if (/^(ban|message-mp|giveaway\/(annuler|terminer)|ticket\/config-supprimer|sous-panel\/supprimer|commandes\/desactiver|invites-config\/reset)$/.test(key) && !confirm('Confirmer cette action sur le serveur ?')) return;
  const btn = document.querySelector('#main .btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Exécution…'; }
  try {
    const r = await api('/api/run', { guildId: S.gid, command: c.name, sub: S.advSub, options, modal: modals ? modal : null });
    const replies = (r.replies || []).map((x) => {
      const emb = (x.embeds || []).map((e) => `${e.title || ''}${e.description ? '\n' + e.description : ''}`).join('\n');
      return esc(x.content || '') + (emb ? '\n' + esc(emb) : '');
    }).join('\n\n') || '✅ Commande exécutée.';
    S.advResult = `<div class="result">${replies}${r.running ? '\n\n⏳ L’opération continue en arrière-plan.' : ''}</div>`;
    toast(r.running ? 'Lancé : continue en arrière-plan' : 'Commande exécutée ✅');
    await refreshGuild();
  } catch (e) {
    S.advResult = `<div class="result" style="border-color:#633039;color:#f2aab7">❌ ${esc(e.message)}</div>`;
    toast(e.message, false);
  } finally {
    render();
  }
}

/* ================================================================== */
/*  SAUVEGARDE                                                         */
/* ================================================================== */
function pageBackup() {
  return head('Sauvegarde', 'Tes données sont enregistrées dans Supabase et dans un fichier sur le bot.') +
    `<section class="card" id="storageCard"><h2>Stockage</h2><div id="storageBox" class="muted">Chargement…</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="sbPush()">Envoyer vers Supabase maintenant</button></div>
    </section>
    <section class="card"><h2>Export / Import</h2>
      <div class="row">
        <a class="btn" href="/api/backup">⬇️ Télécharger tout</a>
        <a class="btn ghost" href="/api/backup?id=${esc(S.gid)}">⬇️ Télécharger ce serveur</a>
        <button class="btn ghost" onclick="bkNow()">📸 Créer une copie sur le bot</button>
      </div>
      <label class="field" style="margin-top:16px"><span>Importer un fichier de sauvegarde</span>
        <small>Remet les données du fichier. Les autres serveurs ne sont pas touchés.</small>
        <input type="file" accept=".json" onchange="bkRestore(this)"></label>
    </section>
    <section class="card" id="backupsCard"><h2>Copies automatiques</h2><div id="backupsBox" class="muted">Chargement…</div></section>
    <section class="card"><h2>Sauvegarde des membres</h2>
      <p class="muted" style="margin-bottom:10px">Enregistre tous les membres (pseudo + rôles). Si le serveur est banni ou recréé, tu peux <b>réinviter tout le monde</b> et les rôles sont restaurés par nom à l’arrivée.</p>
      <div class="row">
        <button class="btn" onclick="membersBackupSave()">💾 Sauvegarder les membres</button>
        <button class="btn ghost" onclick="membersBackupRestore()">📨 Réinviter les membres</button>
      </div>
      <label class="field" style="margin-top:14px"><span>Sauvegarde à utiliser</span><small>Si le serveur a été banni et que tu restaures sur un <b>nouveau</b> serveur, choisis ici la sauvegarde de l’ancien serveur.</small><select id="mb_source"><option value="">Ce serveur</option></select></label>
      <div id="membersBackupBox" class="muted" style="margin-top:12px">Chargement…</div>
      <div class="alert info" style="margin-top:12px">Discord ne permet pas à un bot d’ajouter un membre de force : le bot crée une invitation permanente et l’envoie en MP à chaque membre sauvegardé.</div>
    </section>`;
}
async function sbPush() {
  try { await api('/api/supabase-push', {}); toast('Envoyé vers Supabase ✅'); refreshBackupBoxes(); }
  catch (e) { toast(e.message, false); }
}
async function refreshBackupBoxes() {
  try {
    const s = await api('/api/storage');
    const sb = s.supabase || {};
    const box = $('#storageBox');
    if (box) box.innerHTML = `📄 <span class="code">${esc(s.path)}</span><br>
      📦 ${(s.size / 1024).toFixed(1)} Ko · ${s.guilds} serveur(s)<br>
      🕒 Dernière écriture : ${fmtDate(s.mtime)}<br>
      ☁️ Supabase : ${!sb.enabled ? '<span class="pill ko">désactivé</span>' : sb.lastError ? `<span class="pill ko">${esc(sb.lastError)}</span>` : '<span class="pill ok">connecté</span>'}`;
    const b = await api('/api/backups');
    const bBox = $('#backupsBox');
    if (bBox) bBox.innerHTML = (b.list || []).length ? `<div class="list">${b.list.map((x) => `
      <div class="item"><div class="grow"><b>${esc(x.name.replace(/^sauvegarde-|\.json$/g, ''))}</b><small>${(x.size / 1024).toFixed(1)} Ko · ${fmtDate(x.mtime)}</small></div>
        <div class="row"><a class="mini" href="/api/backup?file=${encodeURIComponent(x.name)}">Télécharger</a>
        <button class="mini" onclick="bkFile('${esc(x.name)}')">Restaurer</button></div></div>`).join('')}</div>` : '<div class="empty">Aucune copie pour le moment.</div>';
  } catch { /* rien */ }
  refreshMembersBackup();
}
async function bkNow() { try { const r = await api('/api/backup-now', {}); toast(r.name ? 'Copie créée ✅' : 'Rien à sauvegarder'); refreshBackupBoxes(); } catch (e) { toast(e.message, false); } }
async function bkRestore(input) {
  const f = input.files[0]; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch { input.value = ''; return toast('Fichier illisible', false); }
  await bkDo(d, 'Importer ce fichier de sauvegarde ?'); input.value = '';
}
async function bkFile(name) {
  let d; try { const r = await fetch('/api/backup?file=' + encodeURIComponent(name)); if (!r.ok) throw 0; d = await r.json(); }
  catch { return toast('Sauvegarde illisible', false); }
  await bkDo(d, `Restaurer la copie « ${name.replace(/^sauvegarde-|\.json$/g, '')} » ?`);
}
async function bkDo(data, label) {
  const ids = Object.keys(data || {});
  if (!ids.length) return toast('Fichier vide', false);
  if (!confirm(label + '\n\nServeurs : ' + ids.join(', ') + '\n\nUne copie de l’état actuel est faite avant.')) return;
  try {
    const r = await api('/api/restore', { data });
    toast('Restauré ✅' + (r.warn ? ' (Supabase : ' + r.warn + ')' : ''), !r.warn);
    await loadGuild(S.gid); refreshBackupBoxes();
  } catch (e) { toast(e.message, false); }
}

/* ---------- Sauvegarde des membres ---------- */
function refreshMembersBackup() {
  const box = $('#membersBackupBox');
  if (!box) return;
  const b = S.g?.memberBackup;
  box.innerHTML = b
    ? `👥 <b>${b.count}</b> membre(s) sauvegardé(s) · ${fmtDate(b.at)}${b.guildName ? ' · ' + esc(b.guildName) : ''}`
    : 'Aucune sauvegarde des membres pour ce serveur. Choisis une sauvegarde d’un autre serveur ci-dessus si besoin.';
  const sel = $('#mb_source');
  if (!sel) return;
  api('/api/members-backup', { guildId: S.gid, action: 'list' }).then((r) => {
    const list = r.backups || [];
    sel.innerHTML = `<option value="">Ce serveur${b ? ` (${b.count})` : ''}</option>` +
      list.map((x) => `<option value="${esc(x.guildId)}">${esc(x.guildName)} — ${x.count} membre(s) · ${fmtDate(x.at)}</option>`).join('');
  }).catch(() => {});
}
async function membersBackupSave() {
  try {
    const r = await api('/api/members-backup', { guildId: S.gid, action: 'save' });
    toast(`${r.count} membre(s) sauvegardé(s) ✅`);
    await loadGuild(S.gid);
    refreshMembersBackup();
  } catch (e) { toast(e.message, false); }
}
async function membersBackupRestore() {
  const fromGuildId = $('#mb_source')?.value || undefined;
  if (!confirm('Créer une invitation permanente et l’envoyer en MP à tous les membres sauvegardés qui ne sont pas encore sur ce serveur ?')) return;
  try {
    const r = await api('/api/members-backup', { guildId: S.gid, action: 'restore', dm: true, fromGuildId });
    toast(`Déjà présents : ${r.present} · Invités en MP : ${r.dmed} · Échecs : ${r.failed}${r.inviteUrl ? ' · ' + r.inviteUrl : ''}`, true);
  } catch (e) { toast(e.message, false); }
}

/* ---------- démarrage ---------- */
boot();
</script>
</body></html>
